name: Repair dependency audit

on:
  push:
    branches:
      - fix/brace-expansion-audit-20260930
    paths:
      - ".github/workflows/repair-dependency-audit.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brace-expansion-audit-20260930
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Apply non-breaking audit fix
        run: npm audit fix --package-lock-only
      - name: Install repaired tree
        run: npm ci
      - name: Verify high-severity audit
        run: npm audit --audit-level=high
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Validate content
        run: npm run validate:content
      - name: Validate assets
        run: npm run validate:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
        run: npm run build
      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "deps: repair high-severity audit findings"
          git push origin HEAD:fix/brace-expansion-audit-20260930
