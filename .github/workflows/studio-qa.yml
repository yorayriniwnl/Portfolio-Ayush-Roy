name: Studio Build Diagnostics

on:
  push:
    branches:
      - design/immersive-studio-20261008

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Validate content and assets
        run: npm run validate:content && npm run validate:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Browser QA
        run: npm run qa:browser
      - name: Save browser screenshots and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
