# Temporary lockfile regeneration workflow. Remove after harvesting artifact.
name: Lockfile Regeneration (temporary)
on:
  push:
    branches:
      - design/yor-signature-experience-20261103
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve patched dev dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile resolves patched minimatch dependency
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/@typescript-eslint/typescript-estree/node_modules/minimatch'] || l.packages['node_modules/minimatch']; if(!p) throw new Error('minimatch package unresolved'); console.log(p.version)"
      - name: Export regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: patched-minimatch-lock
          path: package-lock.json
          if-no-files-found: error
