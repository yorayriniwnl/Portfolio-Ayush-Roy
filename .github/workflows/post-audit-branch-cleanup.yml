name: Post-audit branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/post-audit-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded dependency repair branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in             "fix/brace-expansion-audit-20260930"             "fix/brace-expansion-audit-20261001"
          do
            echo "Deleting $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
