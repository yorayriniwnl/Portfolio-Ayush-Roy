name: One-time dependency lock repair

on:
  push:
    branches: [design/editorial-portfolio-20261010]
    paths: [.github/workflows/repair-dependency-lock.yml]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.repository == 'yorayriniwnl/Portfolio-Ayush-Roy' && github.ref == 'refs/heads/design/editorial-portfolio-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/editorial-portfolio-20261010
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Resolve patched overrides to reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate npm clean install
        run: npm ci --ignore-scripts --no-fund
      - name: Validate production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Validate dev-only advisory policy
        run: node scripts/audit-dev-advisory.mjs
      - name: Save candidate lockfile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-candidate
          path: |
            package.json
            package-lock.json
      - name: Commit audited lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: regenerate audited lockfile with patched overrides"
            git push origin HEAD:design/editorial-portfolio-20261010
          fi
