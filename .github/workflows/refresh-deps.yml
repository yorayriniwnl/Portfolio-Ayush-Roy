name: Refresh vulnerable dependency lock

on:
  push:
    branches:
      - fix/brace-expansion-audit-20261001
    paths:
      - ".github/workflows/refresh-deps.yml"
      - "package.json"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brace-expansion-audit-20261001
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate patched lockfile
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
      - name: Install validated tree
        run: npm ci
      - name: Verify high-severity audit
        run: npm audit --audit-level=high
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Validate content
        run: npm run validate:content
      - name: Validate assets
        run: npm run validate:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Browser QA
        run: npm run qa:browser
      - name: Commit validated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No dependency update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "deps: apply brace-expansion security fix"
          git push origin HEAD:fix/brace-expansion-audit-20261001