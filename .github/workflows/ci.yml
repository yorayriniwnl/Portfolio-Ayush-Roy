name: Portfolio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://portfolio.example.test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Validate content
        run: npm run validate:content
      - name: Validate assets
        run: npm run validate:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Browser QA
        run: npm run qa:browser
