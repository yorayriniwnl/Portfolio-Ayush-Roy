<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Helios energy intelligence</title>
  <desc id="desc">YOR-styled Helios command surface for meter telemetry and anomaly response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c111b"/><stop offset=".55" stop-color="#142017"/><stop offset="1" stop-color="#0c111b"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c7eaa4"/><stop offset="1" stop-color="#e0f4cf"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#f6f3ec" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity=".7"/>
  <circle cx="1010" cy="90" r="230" fill="#3d5a32" opacity=".18" filter="url(#glow)"/>
  <path d="M54 84H274" stroke="#c7eaa4" stroke-width="4"/>
  <text x="54" y="124" fill="#c6cdd8" font-family="monospace" font-size="16" letter-spacing="4">HELIOS // YOR ENERGY INTELLIGENCE</text>
  <text x="54" y="232" fill="#f6f3ec" font-family="Georgia,serif" font-size="78" font-weight="600">See the signal.</text>
  <text x="54" y="310" fill="#f6f3ec" font-family="Georgia,serif" font-size="78" font-weight="600">Move with context.</text>
  <text x="58" y="364" fill="#c6cdd8" font-family="Inter,Arial,sans-serif" font-size="20">Meter telemetry → anomaly triage → field response</text>
  <g transform="translate(54 430)">
    <rect width="1088" height="130" rx="8" fill="#0c111b" fill-opacity=".92" stroke="#f6f3ec" stroke-opacity=".17"/>
    <path d="M30 98H1038" stroke="#3d5a32" stroke-width="2"/>
    <path d="M30 98 130 82 220 90 300 42 395 58 510 32 604 72 700 60 810 18 912 50 1038 30" fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="810" cy="18" r="7" fill="#e0f4cf"/>
    <text x="30" y="32" fill="#e0f4cf" font-family="monospace" font-size="12" letter-spacing="2">TRANSMIT // SAMPLE SIGNAL PATH</text>
    <text x="30" y="120" fill="#c6cdd8" font-family="monospace" font-size="11" letter-spacing="1">REST SNAPSHOT     WEBSOCKET STREAM     DEMO-SAFE FALLBACK</text>
  </g>
  <text x="1142" y="598" text-anchor="end" fill="#c6cdd8" font-family="monospace" font-size="11" letter-spacing="2">CODE-READY // DEPLOYMENT ENVIRONMENT REQUIRED</text>
</svg>
