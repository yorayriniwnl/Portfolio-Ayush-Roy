<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Zenith evidence-first architecture</title>
  <desc id="desc">A code-authored architecture map from inputs through models and policy context to decision output.</desc>
  <rect width="1200" height="420" rx="28" fill="#000"/>
  <g font-family="monospace" fill="#f5eaea">
    <text x="48" y="54" font-size="14" letter-spacing="4">ZENITH // SIGNAL PATH</text>
    <text x="48" y="80" font-size="12" fill="#c4c4c4">every output keeps its evidence boundary visible</text>
  </g>
  <g stroke="#e84b4b" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M230 208H326"/><path d="M506 208H602"/><path d="M782 208H878"/>
  </g>
  <g font-family="monospace">
    <g transform="translate(48 144)"><rect width="182" height="128" rx="16" fill="#0b0808" stroke="#f5eaea" stroke-opacity=".18"/><text x="20" y="34" fill="#ff8a7f" font-size="11" letter-spacing="2">01 / INPUT</text><text x="20" y="68" fill="#f5eaea" font-size="17">bill / roof</text><text x="20" y="96" fill="#c4c4c4" font-size="11">user supplied</text></g>
    <g transform="translate(326 144)"><rect width="182" height="128" rx="16" fill="#671515" fill-opacity=".34" stroke="#e84b4b" stroke-opacity=".5"/><text x="20" y="34" fill="#ff8a7f" font-size="11" letter-spacing="2">02 / MODEL</text><text x="20" y="68" fill="#f5eaea" font-size="17">ROI / NPV</text><text x="20" y="96" fill="#c4c4c4" font-size="11">formula output</text></g>
    <g transform="translate(604 144)"><rect width="182" height="128" rx="16" fill="#0b0808" stroke="#f5eaea" stroke-opacity=".18"/><text x="20" y="34" fill="#e7bd78" font-size="11" letter-spacing="2">03 / CONTEXT</text><text x="20" y="68" fill="#f5eaea" font-size="17">policy layer</text><text x="20" y="96" fill="#c4c4c4" font-size="11">review required</text></g>
    <g transform="translate(882 144)"><rect width="230" height="128" rx="16" fill="#0b0808" stroke="#ff8a7f" stroke-opacity=".45"/><text x="20" y="34" fill="#ff8a7f" font-size="11" letter-spacing="2">04 / OUTPUT</text><text x="20" y="68" fill="#f5eaea" font-size="17">next check</text><text x="20" y="96" fill="#c4c4c4" font-size="11">decision support</text></g>
  </g>
</svg>
