<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Velvetclip local-first file utilities</title>
  <desc id="desc">A technical visualization of a file staying inside the browser: file-type sniffing, decompression-bomb checks, in-browser PDF and image processing, and a local download, with the network upload path crossed out.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="44%" r="70%"><stop offset="0" stop-color="#142017"/><stop offset=".45" stop-color="#142017"/><stop offset="1" stop-color="#0c111b"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".13" stroke="#f6f3ec"><path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/><path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/></g>
  <text x="98" y="105" fill="#e0f4cf" font-family="monospace" font-size="18" letter-spacing="6">VELVETCLIP // LOCAL-FIRST UTILITIES</text>
  <text x="94" y="245" fill="#f6f3ec" font-family="serif" font-size="126" font-weight="600">Your files stay</text>
  <text x="94" y="350" fill="#c7eaa4" font-family="serif" font-size="126" font-style="italic" font-weight="600">in the browser.</text>
  <text x="98" y="420" fill="#9aa6b5" font-family="monospace" font-size="22">select → sniff bytes → process locally → download</text>

  <g transform="translate(100 535)" font-family="monospace">
    <g fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">01 / INPUT</text><text x="24" y="76" fill="#f6f3ec" font-size="19">PDF · image</text><text x="24" y="101" fill="#9aa6b5" font-size="15">media · document</text></g>
    <path d="M230 58H332" stroke="#c7eaa4" stroke-width="2"/><circle cx="281" cy="58" r="5" fill="#c7eaa4" filter="url(#glow)"/>
    <g transform="translate(342)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">02 / SAFETY</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Magic bytes</text><text x="24" y="101" fill="#9aa6b5" font-size="15">bomb · zip checks</text></g>
    <path d="M572 58H674" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(684)" fill="#142017" stroke="#c7eaa4"><rect width="248" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">03 / ENGINE</text><text x="24" y="76" fill="#f6f3ec" font-size="19">PDF.js · pdf-lib</text><text x="24" y="101" fill="#9aa6b5" font-size="15">in-browser workers</text></g>
    <path d="M942 58H1044" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(1054)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">04 / OUTPUT</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Local download</text><text x="24" y="101" fill="#9aa6b5" font-size="15">no file upload</text></g>
  </g>

  <g transform="translate(1138 150)" font-family="monospace">
    <rect x="40" y="30" width="260" height="280" rx="18" fill="#0c111b" stroke="#c7eaa4" stroke-opacity=".7"/>
    <rect x="40" y="30" width="260" height="42" rx="18" fill="#142017" stroke="#c7eaa4" stroke-opacity=".7"/>
    <g fill="#c7eaa4"><circle cx="68" cy="51" r="6"/><circle cx="90" cy="51" r="6" fill-opacity=".6"/><circle cx="112" cy="51" r="6" fill-opacity=".3"/></g>
    <rect x="96" y="112" width="148" height="176" rx="10" fill="#142017" stroke="#c7eaa4" filter="url(#glow)"/>
    <path d="M122 158H218M122 188H218M122 218H190" stroke="#9aa6b5" stroke-width="3"/>
    <text x="139" y="268" fill="#f6f3ec" font-size="17">LOCAL</text>
    <path d="M300 170H356" stroke="#6b7787" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M318 154L338 186M338 154L318 186" stroke="#c7eaa4" stroke-width="3"/>
    <text x="300" y="214" fill="#6b7787" font-size="14">upload</text>
  </g>
  <text x="101" y="830" fill="#6b7787" font-family="monospace" font-size="16" letter-spacing="2">27 TOOLS / CLIENT-SIDE PROCESSING / PRIVATE SOURCE</text>
</svg>
