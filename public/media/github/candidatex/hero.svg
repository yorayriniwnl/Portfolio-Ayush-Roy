<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CandidateX evidence intelligence field</title>
  <desc id="desc">A technical visualization connecting candidate evidence to an evidence graph, capability coverage, contradictions, interview probes and a human recruiter.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="44%" r="70%"><stop offset="0" stop-color="#142017"/><stop offset=".45" stop-color="#142017"/><stop offset="1" stop-color="#0c111b"/></radialGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#c7eaa4"/><stop offset="1" stop-color="#3d5a32"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".13" stroke="#f6f3ec"><path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/><path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/></g>
  <text x="98" y="105" fill="#e0f4cf" font-family="monospace" font-size="18" letter-spacing="6">CANDIDATEX // CAPABILITY INTELLIGENCE</text>
  <text x="94" y="245" fill="#f6f3ec" font-family="serif" font-size="126" font-weight="600">Evidence before</text>
  <text x="94" y="350" fill="#c7eaa4" font-family="serif" font-size="126" font-style="italic" font-weight="600">confidence.</text>
  <text x="98" y="420" fill="#9aa6b5" font-family="monospace" font-size="22">synthetic evidence → provenance → capability → interview probes</text>

  <g transform="translate(100 535)" font-family="monospace">
    <g fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">01 / MANIFEST</text><text x="24" y="76" fill="#f6f3ec" font-size="19">CV · GitHub</text><text x="24" y="101" fill="#9aa6b5" font-size="15">links · claims</text></g>
    <path d="M230 58H332" stroke="#c7eaa4" stroke-width="2"/><circle cx="281" cy="58" r="5" fill="#c7eaa4" filter="url(#glow)"/>
    <g transform="translate(342)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">02 / STATIC</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Safe analysis</text><text x="24" y="101" fill="#9aa6b5" font-size="15">never execute code</text></g>
    <path d="M572 58H674" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(684)" fill="#142017" stroke="#c7eaa4"><rect width="248" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">03 / CEG</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Evidence graph</text><text x="24" y="101" fill="#9aa6b5" font-size="15">provenance attached</text></g>
    <path d="M942 58H1044" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(1054)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">04 / HUMAN</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Interview probes</text><text x="24" y="101" fill="#9aa6b5" font-size="15">decision stays human</text></g>
  </g>

  <g transform="translate(1138 160)" fill="none" stroke="#c7eaa4" stroke-opacity=".7">
    <circle cx="170" cy="170" r="142"/><circle cx="170" cy="170" r="100" stroke-opacity=".35"/><circle cx="170" cy="170" r="54" fill="#142017" fill-opacity=".8" filter="url(#glow)"/>
    <path d="M38 118L170 170 284 62M170 170L303 235M170 170L89 291"/>
    <g fill="#c7eaa4" stroke="none"><circle cx="38" cy="118" r="8"/><circle cx="284" cy="62" r="8"/><circle cx="303" cy="235" r="8"/><circle cx="89" cy="291" r="8"/></g>
    <text x="136" y="177" fill="#f6f3ec" stroke="none" font-family="monospace" font-size="21">CEG</text>
  </g>
  <text x="101" y="830" fill="#6b7787" font-family="monospace" font-size="16" letter-spacing="2">RESEARCH PROTOTYPE / PROVENANCE-GROUNDED / HUMAN-IN-THE-LOOP</text>
</svg>
