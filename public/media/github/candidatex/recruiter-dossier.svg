<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">CandidateX recruiter dossier</title><desc id="desc">A recruiter-facing dossier layout separating role capability, evidence coverage, contradiction alerts and interview probes.</desc>
<rect width="1400" height="800" fill="#0c111a"/><rect x="42" y="38" width="1316" height="724" rx="22" fill="#0c111a" stroke="#252b35"/><text x="80" y="92" fill="#8c97a7" font-family="monospace" font-size="15">CANDIDATEX / RECRUITER DOSSIER / DEMONSTRATION SURFACE</text>
<text x="80" y="152" fill="#f3f5f8" font-family="sans-serif" font-size="40" font-weight="700">Candidate evidence, separated from the decision.</text>
<g font-family="monospace">
<g transform="translate(80 205)"><rect width="260" height="156" rx="16" fill="#12161c" stroke="#2e3641"/><text x="24" y="37" fill="#7f8999" font-size="14">ROLE CAPABILITY INDEX</text><text x="24" y="102" fill="#bbe792" font-size="58">78.4</text><text x="24" y="132" fill="#8995a6" font-size="13">observed dimensions only</text></g>
<g transform="translate(365 205)"><rect width="260" height="156" rx="16" fill="#12161c" stroke="#2e3641"/><text x="24" y="37" fill="#7f8999" font-size="14">EVIDENCE COVERAGE</text><text x="24" y="102" fill="#f3f5f8" font-size="58">64%</text><text x="24" y="132" fill="#8995a6" font-size="13">missing ≠ incapable</text></g>
<g transform="translate(650 205)"><rect width="305" height="156" rx="16" fill="#0c111a" stroke="#416c18"/><text x="24" y="37" fill="#bbe792" font-size="14">CONTRADICTION</text><text x="24" y="79" fill="#f3f5f8" font-size="23">Deployment claim</text><text x="24" y="111" fill="#babec3" font-size="15">needs stronger evidence</text><text x="24" y="136" fill="#bbe792" font-size="13">→ generate interview probe</text></g>
<g transform="translate(980 205)"><rect width="300" height="156" rx="16" fill="#12161c" stroke="#2e3641"/><text x="24" y="37" fill="#7f8999" font-size="14">DECISION BOUNDARY</text><text x="24" y="83" fill="#f3f5f8" font-size="24">Human reviewer</text><text x="24" y="116" fill="#8995a6" font-size="14">CandidateX does not</text><text x="24" y="139" fill="#8995a6" font-size="14">auto hire / reject</text></g>
</g>
<g transform="translate(80 404)" font-family="monospace"><rect width="760" height="292" rx="16" fill="#0c111b" stroke="#292f39"/><text x="24" y="38" fill="#8c97a7" font-size="14">CAPABILITY EVIDENCE</text>
<g fill="#202731"><rect x="24" y="70" width="620" height="16" rx="8"/><rect x="24" y="122" width="620" height="16" rx="8"/><rect x="24" y="174" width="620" height="16" rx="8"/><rect x="24" y="226" width="620" height="16" rx="8"/></g><g fill="#bbe792"><rect x="24" y="70" width="472" height="16" rx="8"/><rect x="24" y="122" width="397" height="16" rx="8"/><rect x="24" y="174" width="536" height="16" rx="8"/><rect x="24" y="226" width="285" height="16" rx="8"/></g><g fill="#aab3c1" font-size="14"><text x="664" y="84">Backend</text><text x="664" y="136">Database</text><text x="664" y="188">Testing</text><text x="664" y="240">Cloud</text></g></g>
<g transform="translate(870 404)" font-family="monospace"><rect width="410" height="292" rx="16" fill="#0c111a" stroke="#2d3746"/><text x="24" y="38" fill="#bbe792" font-size="14">NEXT INTERVIEW PROBES</text><text x="24" y="86" fill="#f3f5f8" font-size="17">01 / Ownership depth</text><text x="24" y="116" fill="#9ea6b2" font-size="13">Trace the system boundary you owned.</text><text x="24" y="164" fill="#f3f5f8" font-size="17">02 / Failure handling</text><text x="24" y="194" fill="#9ea6b2" font-size="13">What breaks first under load?</text><text x="24" y="242" fill="#f3f5f8" font-size="17">03 / Deployment claim</text><text x="24" y="272" fill="#9ea6b2" font-size="13">Show the evidence behind the claim.</text></g>
</svg>
