<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
<title id="title">CandidateX system architecture</title><desc id="desc">A staged architecture from candidate and role intake through safe evidence acquisition, static analyzers, evidence graph, capability engine, diagnostics and recruiter dossier.</desc>
