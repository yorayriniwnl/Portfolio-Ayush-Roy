<g font-family="monospace" font-size="17">
  <g transform="translate(70 160)"><rect width="190" height="104" rx="12" fill="#101014" stroke="#4c4346"/><text x="20" y="34" fill="#ff6672">01 / INTAKE</text><text x="20" y="68" fill="#f4f0ea">Candidate + role</text><text x="20" y="92" fill="#9b9295" font-size="14">CV · JD · links</text></g>
  <g transform="translate(300 160)"><rect width="220" height="104" rx="12" fill="#101014" stroke="#4c4346"/><text x="20" y="34" fill="#ff6672">02 / ACQUIRE</text><text x="20" y="68" fill="#f4f0ea">Safe acquisition</text><text x="20" y="92" fill="#9b9295" font-size="14">SSRF + manifest guard</text></g>
  <g transform="translate(560 160)"><rect width="220" height="104" rx="12" fill="#101014" stroke="#4c4346"/><text x="20" y="34" fill="#ff6672">03 / ANALYZE</text><text x="20" y="68" fill="#f4f0ea">Static analyzers</text><text x="20" y="92" fill="#9b9295" font-size="14">AST · infra · SQL</text></g>
  <g transform="translate(820 143)"><rect width="250" height="138" rx="16" fill="#18080d" stroke="#ff3040" stroke-width="2"/><text x="22" y="39" fill="#ff6672">04 / EVIDENCE GRAPH</text><text x="22" y="77" fill="#f4f0ea">Candidate Evidence</text><text x="22" y="102" fill="#f4f0ea">Graph</text><text x="22" y="126" fill="#9b9295" font-size="14">immutable provenance</text></g>
