<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">CandidateX research evidence boundary</title><desc id="desc">The submitted paper's 28,800 synthetic candidate-role evaluations are explicitly separated from the repository's 4,800-sample supplementary implementation ablation. Neither is real-world hiring validation.</desc>
<rect width="1400" height="700" fill="#070709"/><text x="70" y="75" fill="#ff5a66" font-family="monospace" font-size="18" letter-spacing="4">RESEARCH PROVENANCE / DO NOT CONFLATE</text>
<g font-family="monospace">
<g transform="translate(70 140)"><rect width="560" height="350" rx="22" fill="#110c10" stroke="#ff3040" stroke-width="2"/><text x="38" y="58" fill="#ff6a75" font-size="18">SUBMITTED PAPER</text><text x="38" y="145" fill="#f4f0ea" font-size="76">28,800</text><text x="38" y="188" fill="#f4f0ea" font-size="24">candidate-role evaluations</text><text x="38" y="238" fill="#9d9497" font-size="17">16 seeds × 300 profiles × 6 roles</text><text x="38" y="292" fill="#ff8891" font-size="16">SYNTHETIC CONTROLLED BENCHMARK</text><text x="38" y="324" fill="#7f7679" font-size="14">paper headline experiment</text></g>
<text x="676" y="330" fill="#6f666a" font-size="54">≠</text>
<g transform="translate(770 140)"><rect width="560" height="350" rx="22" fill="#0e0f12" stroke="#4b4448"/><text x="38" y="58" fill="#b9b1b4" font-size="18">REPOSITORY SUPPLEMENT</text><text x="38" y="145" fill="#f4f0ea" font-size="76">4,800</text><text x="38" y="188" fill="#f4f0ea" font-size="24">synthetic samples</text><text x="38" y="238" fill="#9d9497" font-size="17">implementation ablation harness</text><text x="38" y="292" fill="#c4bdc0" font-size="16">SUPPLEMENTARY DIAGNOSTIC</text><text x="38" y="324" fill="#7f7679" font-size="14">not the paper headline benchmark</text></g>
<g transform="translate(70 540)"><rect width="1260" height="92" rx="16" fill="#2a090f" stroke="#7e1b29"/><text x="32" y="39" fill="#ff7882" font-size="17">BOUNDARY</text><text x="32" y="69" fill="#f4f0ea" font-size="18">SYNTHETIC RESEARCH EVIDENCE · NOT REAL-WORLD HIRING VALIDATION · HUMAN REVIEW REQUIRED</text></g>
