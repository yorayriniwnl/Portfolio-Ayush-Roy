<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FalseQuiet hybrid intrusion detection</title>
  <desc id="desc">A technical visualization of FalseQuiet's two detection streams: supervised XGBoost and TabTransformer classifiers and an unsupervised autoencoder, fused into Normal, Known Attack, or Suspicious verdicts with SHAP explanations.</desc>
  <defs>
    <radialGradient id="bg" cx="70%" cy="44%" r="70%"><stop offset="0" stop-color="#142017"/><stop offset=".45" stop-color="#142017"/><stop offset="1" stop-color="#0c111b"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity=".13" stroke="#f6f3ec"><path d="M0 90H1600M0 180H1600M0 270H1600M0 360H1600M0 450H1600M0 540H1600M0 630H1600M0 720H1600M0 810H1600"/><path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900M1200 0V900M1300 0V900M1400 0V900M1500 0V900"/></g>
  <text x="98" y="105" fill="#e0f4cf" font-family="monospace" font-size="18" letter-spacing="6">FALSEQUIET // HYBRID INTRUSION DETECTION</text>
  <text x="94" y="245" fill="#f6f3ec" font-family="serif" font-size="126" font-weight="600">Quiet is not</text>
  <text x="94" y="350" fill="#c7eaa4" font-family="serif" font-size="126" font-style="italic" font-weight="600">the same as safe.</text>
  <text x="98" y="420" fill="#9aa6b5" font-family="monospace" font-size="22">flows → classifiers + autoencoder → fused verdict → SHAP</text>

  <g transform="translate(100 535)" font-family="monospace">
    <g fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">01 / FLOWS</text><text x="24" y="76" fill="#f6f3ec" font-size="19">CIC-IDS2017</text><text x="24" y="101" fill="#9aa6b5" font-size="15">network features</text></g>
    <path d="M230 58H332" stroke="#c7eaa4" stroke-width="2"/><circle cx="281" cy="58" r="5" fill="#c7eaa4" filter="url(#glow)"/>
    <g transform="translate(342)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">02 / KNOWN</text><text x="24" y="76" fill="#f6f3ec" font-size="19">XGBoost · TabT</text><text x="24" y="101" fill="#9aa6b5" font-size="15">supervised stream</text></g>
    <path d="M572 58H674" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(684)" fill="#142017" stroke="#c7eaa4"><rect width="248" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">03 / UNSEEN</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Autoencoder</text><text x="24" y="101" fill="#9aa6b5" font-size="15">reconstruction error</text></g>
    <path d="M942 58H1044" stroke="#c7eaa4" stroke-width="2"/>
    <g transform="translate(1054)" fill="#0c111b" stroke="#3a4656"><rect width="220" height="116" rx="12"/><text x="24" y="40" fill="#e0f4cf" font-size="16">04 / EXPLAIN</text><text x="24" y="76" fill="#f6f3ec" font-size="19">Fusion · SHAP</text><text x="24" y="101" fill="#9aa6b5" font-size="15">3 verdict states</text></g>
  </g>

  <g transform="translate(1138 150)" fill="none" font-family="monospace">
    <circle cx="170" cy="170" r="142" stroke="#c7eaa4" stroke-opacity=".7"/>
    <circle cx="170" cy="170" r="100" stroke="#c7eaa4" stroke-opacity=".35" stroke-dasharray="5 8"/>
    <path d="M28 170H312M170 28V312" stroke="#c7eaa4" stroke-opacity=".25"/>
    <path d="M170 170L276 76" stroke="#c7eaa4" stroke-width="3" filter="url(#glow)"/>
    <g fill="#c7eaa4" stroke="none"><circle cx="232" cy="118" r="9"/><circle cx="102" cy="226" r="6" fill-opacity=".5"/><circle cx="84" cy="98" r="6" fill-opacity=".5"/><circle cx="240" cy="246" r="6" fill-opacity=".5"/></g>
    <circle cx="170" cy="170" r="10" fill="#c7eaa4" stroke="none"/>
    <text x="196" y="108" fill="#f6f3ec" stroke="none" font-size="15">suspicious</text>
  </g>
  <text x="101" y="830" fill="#6b7787" font-family="monospace" font-size="16" letter-spacing="2">RESEARCH PROTOTYPE / HELD-OUT ATTACK PROXY / NOT A FIELD-VALIDATED DETECTOR</text>
</svg>
